# Genera el APK automáticamente en GitHub (pestaña Actions → "APK Android" → artefacto "checador-campo-apk").
name: APK Android
on:
  workflow_dispatch:
  push:
    paths: ["www/**", "capacitor.config.json", "package.json", ".github/workflows/apk-android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos de cámara y GPS
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera.front" android:required="false" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n</manifest>#' $M
          cat $M

      - name: Ícono de la app
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              [ -f android/app/src/main/res/mipmap-$d/$f.png ] && cp www/icons/icon-192.png android/app/src/main/res/mipmap-$d/$f.png || true
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml

      - name: Sincronizar web
        run: npx cap sync android

      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: checador-campo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
