<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0054A6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Checador">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Checador de Campo</title>
<script src="js/config.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
<script src="js/rostro.js"></script>
<style>
  html,body{height:100%}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
  .vista{display:none}.vista.activa{display:flex}
  video{transform:scaleX(-1)}
</style>
</head>
<body class="font-sans antialiased">
<div class="max-w-md mx-auto min-h-full flex flex-col">

  <header class="bg-primary text-on-primary px-5 py-4 flex items-center gap-3 shadow">
    <i data-lucide="map-pin-check" class="w-6 h-6"></i>
    <div class="flex-1">
      <h1 class="font-semibold leading-tight">Checador de Campo</h1>
      <p class="text-xs opacity-80" id="hEmpresa"></p>
    </div>
  </header>

  <!-- Aviso instalación iOS -->
  <div id="avisoIOS" class="hidden m-4 p-3 rounded-xl bg-secondary/15 border border-secondary/40 text-sm">
    Para usarla como app: toca <b>Compartir</b> <i data-lucide="share" class="inline w-4 h-4"></i> y luego <b>Agregar a pantalla de inicio</b>.
  </div>

  <!-- 1. Selección de empleado -->
  <section id="vSeleccion" class="vista activa flex-col flex-1 p-4 gap-3">
    <h2 class="text-lg font-semibold">¿Quién va a checar?</h2>
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3.5 text-muted"></i>
      <input id="buscar" type="search" autocomplete="off" placeholder="ID o nombre"
        class="w-full pl-9 pr-3 py-3 rounded-xl bg-surface border border-line focus:outline-none focus:ring-2 focus:ring-primary">
    </div>
    <div id="lista" class="flex-1 overflow-y-auto rounded-xl bg-surface border border-line divide-y divide-line min-h-[200px]">
      <p class="p-4 text-muted text-sm">Cargando personal…</p>
    </div>
  </section>

  <!-- 2. Checar -->
  <section id="vChecar" class="vista flex-col flex-1 p-4 gap-3">
    <div class="flex items-center gap-3 bg-surface border border-line rounded-xl p-3">
      <div class="w-10 h-10 rounded-full bg-primary/15 text-primary flex items-center justify-center font-semibold" id="cIniciales"></div>
      <div class="flex-1 min-w-0">
        <p class="font-semibold truncate" id="cNombre"></p>
        <p class="text-xs text-muted truncate" id="cPuesto"></p>
      </div>
      <button id="btnCambiar" class="text-sm text-primary font-medium">Cambiar</button>
    </div>

    <div id="gpsCaja" class="flex items-center gap-3 rounded-xl p-3 border border-line bg-surface">
      <i data-lucide="satellite" class="w-5 h-5 text-muted"></i>
      <div class="flex-1">
        <p class="text-sm font-medium" id="gpsTexto">Buscando señal GPS…</p>
        <p class="text-xs text-muted" id="gpsDetalle">Se requiere precisión menor a 30 m</p>
      </div>
      <span id="gpsPunto" class="w-3 h-3 rounded-full bg-warning animate-pulse"></span>
    </div>

    <div class="relative rounded-2xl overflow-hidden bg-black aspect-[3/4]">
      <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
      <div id="camAviso" class="absolute inset-0 flex items-center justify-center text-white/80 text-sm p-6 text-center">Activando cámara…</div>
      <p class="absolute bottom-2 inset-x-0 text-center text-white/90 text-xs drop-shadow">Que se vea tu rostro y el lugar de servicio</p>
    </div>

    <!-- Respaldo si el navegador no permite video en vivo: cámara frontal, sin galería -->
    <label id="respaldo" class="hidden w-full text-center py-3 rounded-xl border-2 border-dashed border-primary text-primary font-medium">
      <input id="inputFoto" type="file" accept="image/*" capture="user" class="hidden">
      Tomar selfie con la cámara
    </label>

    <button id="btnChecar" disabled
      class="w-full py-4 rounded-2xl bg-primary text-on-primary text-lg font-semibold shadow disabled:opacity-40 flex items-center justify-center gap-2">
      <i data-lucide="fingerprint" class="w-6 h-6"></i><span>Checar</span>
    </button>
  </section>

  <!-- 3. Resultado -->
  <section id="vResultado" class="vista flex-col flex-1 p-4 gap-4 items-center justify-center text-center">
    <div id="rIcono" class="w-24 h-24 rounded-full flex items-center justify-center"></div>
    <h2 id="rTitulo" class="text-2xl font-bold"></h2>
    <p id="rHora" class="text-muted"></p>
    <ul id="rCausas" class="text-sm text-left w-full space-y-2"></ul>
    <img id="rFoto" class="w-32 h-32 object-cover rounded-xl border border-line" alt="">
    <button id="btnListo" class="w-full py-4 rounded-2xl bg-primary text-on-primary font-semibold">Listo</button>
  </section>

  <div id="toast" class="hidden fixed bottom-6 inset-x-4 max-w-md mx-auto p-3 rounded-xl bg-danger text-white text-sm shadow-lg"></div>
</div>

<script>
const C = window.APP_CONFIG;
const sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esNativo = !!window.Capacitor?.isNativePlatform?.();
const esIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const PLATAFORMA = esNativo ? "android-apk" : esIOS ? "ios-web" : "web";
const MAX_ACC = C.PRECISION_MAX_M;

let empleados = [], empleado = null, pos = null, gpsWatch = null, stream = null, enviando = false, modelosOK = false;

$("#hEmpresa").textContent = C.EMPRESA;
lucide.createIcons();

function vista(id) {
  document.querySelectorAll(".vista").forEach(v => v.classList.toggle("activa", v.id === id));
  window.scrollTo(0, 0);
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hidden"), 5000);
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();

// ---------- Selección ----------
async function cargarEmpleados() {
  const { data, error } = await sb.rpc("campo_lista_empleados");
  if (error) { $("#lista").innerHTML = `<p class="p-4 text-danger text-sm">No se pudo cargar el personal. Revisa tu conexión.</p>`; return; }
  empleados = data; pintarLista();
}
function pintarLista() {
  const q = norm($("#buscar").value.trim());
  const f = empleados.filter(e => !q || norm(e.id).includes(q) || norm(e.nombre).includes(q)).slice(0, 80);
  $("#lista").innerHTML = f.length ? f.map(e => `
    <button data-id="${esc(e.id)}" class="w-full text-left px-4 py-3 active:bg-primary/10 flex items-center gap-3">
      <span class="text-xs font-mono px-2 py-1 rounded bg-primary/10 text-primary">${esc(e.id)}</span>
      <span class="flex-1 min-w-0"><span class="block truncate">${esc(e.nombre)}</span>
      <span class="block text-xs text-muted truncate">${esc(e.puesto)}</span></span>
    </button>`).join("") : `<p class="p-4 text-muted text-sm">Sin resultados</p>`;
}
$("#buscar").addEventListener("input", pintarLista);
$("#lista").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  const emp = empleados.find(x => x.id === b.dataset.id);
  if (!confirm(`¿Eres ${emp.nombre}?`)) return;
  try { localStorage.setItem("campo_empleado", JSON.stringify(emp)); } catch {}
  abrirChecar(emp);
});
$("#btnCambiar").addEventListener("click", () => {
  detener(); try { localStorage.removeItem("campo_empleado"); } catch {}
  empleado = null; $("#buscar").value = ""; pintarLista(); vista("vSeleccion");
});

// ---------- Checar ----------
function abrirChecar(emp) {
  empleado = emp;
  $("#cNombre").textContent = emp.nombre;
  $("#cPuesto").textContent = `${emp.id} · ${emp.puesto ?? ""}`;
  $("#cIniciales").textContent = emp.nombre.split(" ").slice(0, 2).map(p => p[0]).join("");
  vista("vChecar");
  iniciarGPS(); iniciarCamara(); prepararRostro();
}
async function prepararRostro() {
  if (modelosOK) return;
  $("#btnChecar span").textContent = "Preparando reconocimiento…";
  try { await Rostro.cargar(); modelosOK = true; $("#btnChecar span").textContent = "Checar"; }
  catch { $("#btnChecar span").textContent = "Checar"; toast("No se pudo preparar el reconocimiento facial. Revisa tu internet."); setTimeout(prepararRostro, 8000); }
  actualizarBoton();
}

function iniciarGPS() {
  pos = null; pintarGPS();
  if (!navigator.geolocation) return gpsError("Este dispositivo no tiene GPS disponible");
  gpsWatch = navigator.geolocation.watchPosition(p => {
    const acc = p.coords.accuracy, viejo = !pos || Date.now() - pos.t > 15000;
    if (viejo || acc <= pos.acc) pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc, t: Date.now() };
    pintarGPS();
  }, e => gpsError(e.code === 1 ? "Permiso de ubicación denegado. Actívalo en Ajustes." : "No se pudo obtener la ubicación"),
  { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function gpsValido() { return pos && pos.acc < MAX_ACC && Date.now() - pos.t < 30000; }
function pintarGPS() {
  const ok = gpsValido();
  $("#gpsTexto").textContent = !pos ? "Buscando señal GPS…" : ok ? "Ubicación lista" : "Mejorando precisión…";
  $("#gpsDetalle").textContent = pos ? `Precisión: ${Math.round(pos.acc)} m (requerido < ${MAX_ACC} m)` : `Se requiere precisión menor a ${MAX_ACC} m`;
  $("#gpsPunto").className = `w-3 h-3 rounded-full ${ok ? "bg-accent" : "bg-warning animate-pulse"}`;
  actualizarBoton();
}
function gpsError(msg) {
  $("#gpsTexto").textContent = msg; $("#gpsDetalle").textContent = "";
  $("#gpsPunto").className = "w-3 h-3 rounded-full bg-danger";
}
setInterval(() => { if (empleado && $("#vChecar").classList.contains("activa")) pintarGPS(); }, 3000);

let camLista = false;
async function iniciarCamara() {
  camLista = false; $("#camAviso").classList.remove("hidden"); $("#camAviso").textContent = "Activando cámara…";
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
    const v = $("#video"); v.srcObject = stream; await v.play();
    camLista = true; $("#camAviso").classList.add("hidden"); $("#respaldo").classList.add("hidden");
  } catch (e) {
    $("#camAviso").textContent = "No se pudo abrir la cámara en vivo. Usa el botón de abajo.";
    $("#respaldo").classList.remove("hidden");
  }
  actualizarBoton();
}
function detener() {
  if (gpsWatch != null) navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null;
  stream?.getTracks().forEach(t => t.stop()); stream = null; camLista = false;
}
function actualizarBoton() { $("#btnChecar").disabled = !(gpsValido() && camLista && modelosOK) || enviando; }

function aCanvas(fuente, w, h) {
  const max = 960, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext("2d").drawImage(fuente, 0, 0, c.width, c.height);
  return c;
}

$("#btnChecar").addEventListener("click", () => {
  const v = $("#video");
  if (!v.videoWidth) return toast("La cámara aún no está lista");
  enviar(aCanvas(v, v.videoWidth, v.videoHeight));
});

// Respaldo: solo se aceptan fotos recién tomadas (una foto de galería trae fecha antigua)
$("#inputFoto").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (Date.now() - f.lastModified > 120000) return toast("Solo se aceptan fotos tomadas en este momento con la cámara.");
  if (!gpsValido()) return toast("Espera a que la ubicación esté lista.");
  if (!modelosOK) return toast("Espera a que termine de prepararse el reconocimiento.");
  const img = new Image(); img.src = URL.createObjectURL(f); await img.decode();
  enviar(aCanvas(img, img.naturalWidth, img.naturalHeight));
});

async function enviar(lienzo) {
  if (enviando) return;
  if (!gpsValido()) return toast("La ubicación no tiene la precisión requerida.");
  enviando = true; actualizarBoton();
  $("#btnChecar span").textContent = "Analizando rostro…";
  try {
    const foto = lienzo.toDataURL("image/jpeg", 0.75);
    const huella = await Rostro.huella(lienzo);
    if (!huella) throw new Error("No se detectó tu rostro. Acércate, busca buena luz y vuelve a intentar.");
    $("#btnChecar span").textContent = "Validando…";
    const r = await fetch(`${C.SUPABASE_URL}/functions/v1/${C.FUNCION_CHECKIN}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: C.SUPABASE_ANON_KEY, Authorization: `Bearer ${C.SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ idEmpleado: empleado.id, latitud: pos.lat, longitud: pos.lng, precision: pos.acc, fotoBase64: foto, huella, plataforma: PLATAFORMA })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `Error ${r.status}`);
    detener(); mostrarResultado(d, foto);
  } catch (e) {
    toast(e.message === "Failed to fetch" ? "Sin conexión. Intenta de nuevo." : e.message);
  } finally {
    enviando = false; $("#btnChecar span").textContent = "Checar"; actualizarBoton();
  }
}

function mostrarResultado(d, foto) {
  const ok = d.estatus === "APROBADO_AUTOMATICO";
  $("#rIcono").className = `w-24 h-24 rounded-full flex items-center justify-center ${ok ? "bg-accent/15 text-accent" : "bg-warning/15 text-warning"}`;
  $("#rIcono").innerHTML = `<i data-lucide="${ok ? "circle-check-big" : "clock-alert"}" class="w-14 h-14"></i>`;
  $("#rTitulo").textContent = ok ? "Checada registrada" : "Enviada a revisión de RH";
  const hora = new Date(d.ts_servidor).toLocaleString("es-MX", { timeZone: C.ZONA_HORARIA, dateStyle: "medium", timeStyle: "medium" });
  $("#rHora").textContent = `${d.nombre} · ${hora}`;
  $("#rCausas").innerHTML = (d.causas || []).map(c => `<li class="flex gap-2 p-3 rounded-xl bg-warning/10"><i data-lucide="triangle-alert" class="w-4 h-4 text-warning shrink-0 mt-0.5"></i><span>${esc(c)}</span></li>`).join("");
  $("#rFoto").src = foto;
  lucide.createIcons(); vista("vResultado");
}
$("#btnListo").addEventListener("click", () => abrirChecar(empleado));

// ---------- Arranque ----------
document.addEventListener("visibilitychange", () => {
  if (document.hidden) detener();
  else if (empleado && $("#vChecar").classList.contains("activa")) { iniciarGPS(); iniciarCamara(); }
});
if (esIOS && !esNativo && !navigator.standalone) $("#avisoIOS").classList.remove("hidden");
if (!esNativo && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");

cargarEmpleados();
try {
  const g = JSON.parse(localStorage.getItem("campo_empleado") || "null");
  if (g) abrirChecar(g);
} catch {}
</script>
</body>
</html>
